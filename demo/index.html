<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotaptcha Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .captcha-container {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        #captchaImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .instruction {
            color: #555;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #verifyBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #verifyBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #verifyBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #refreshBtn {
            background: #f0f0f0;
            color: #333;
        }

        #refreshBtn:hover {
            background: #e0e0e0;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Rotaptcha Demo</h1>
        <p class="subtitle">Gamified CAPTCHA Solution</p>
        
        <div class="captcha-container">
            <div id="loadingIndicator" class="loading">
                <div class="spinner"></div>
                <p>Loading captcha...</p>
            </div>
            <img id="captchaImage" style="display: none;" alt="Captcha Image">
            <p class="instruction">Guess the rotation angle of the shape (in degrees)</p>
        </div>

        <div class="input-group">
            <label for="answerInput">Enter your answer (0-360°):</label>
            <input type="number" id="answerInput" placeholder="e.g., 45" min="0" max="360" step="10">
        </div>

        <div class="button-group">
            <button id="verifyBtn">Verify Answer</button>
            <button id="refreshBtn">🔄 New Captcha</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        let currentToken = null;

        async function loadCaptcha() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const captchaImage = document.getElementById('captchaImage');
            const message = document.getElementById('message');
            const answerInput = document.getElementById('answerInput');
            
            loadingIndicator.style.display = 'block';
            captchaImage.style.display = 'none';
            message.style.display = 'none';
            answerInput.value = '';

            try {
                const response = await fetch('/api/create');
                const data = await response.json();
                
                currentToken = data.token;
                captchaImage.src = data.image;
                captchaImage.style.display = 'block';
                loadingIndicator.style.display = 'none';
            } catch (error) {
                loadingIndicator.innerHTML = '<p>Error loading captcha. Please refresh.</p>';
                console.error('Error:', error);
            }
        }

        async function verifyCaptcha() {
            const answerInput = document.getElementById('answerInput');
            const message = document.getElementById('message');
            const verifyBtn = document.getElementById('verifyBtn');
            
            const answer = answerInput.value;
            
            if (!answer) {
                showMessage('Please enter an answer', 'error');
                return;
            }

            if (!currentToken) {
                showMessage('Please load a captcha first', 'error');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        uuid: currentToken,
                        answer: answer
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage('✓ Correct! Well done!', 'success');
                    setTimeout(() => {
                        loadCaptcha();
                    }, 2000);
                } else {
                    showMessage('✗ Incorrect. Try again or get a new captcha.', 'error');
                }
            } catch (error) {
                showMessage('Error verifying answer', 'error');
                console.error('Error:', error);
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Answer';
            }
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        // Event listeners
        document.getElementById('verifyBtn').addEventListener('click', verifyCaptcha);
        document.getElementById('refreshBtn').addEventListener('click', loadCaptcha);
        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyCaptcha();
            }
        });

        // Load captcha on page load
        loadCaptcha();
    </script>
</body>
</html>
