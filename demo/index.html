<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotaptcha Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .captcha-container {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        #captchaImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .instruction {
            color: #555;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #verifyBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #verifyBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #verifyBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #refreshBtn {
            background: #f0f0f0;
            color: #333;
        }

        #refreshBtn:hover {
            background: #e0e0e0;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Rotaptcha Demo</h1>
        <p class="subtitle">Gamified CAPTCHA Solution</p>
        
        <div class="captcha-container">
            <div id="loadingIndicator" class="loading">
                <div class="spinner"></div>
                <p>Loading captcha...</p>
            </div>
            <img id="captchaImage" style="display: none;" alt="Captcha Image">
            <p class="instruction">Guess the rotation angle of the shape (in degrees)</p>
        </div>

        <div class="input-group">
            <label for="answerInput">Enter your answer (0-360°):</label>
            <input type="number" id="answerInput" placeholder="e.g., 45" min="0" max="360" step="10">
        </div>

        <div class="input-group">
            <label for="strokeWidth">Stroke Width (1-10):</label>
            <input type="number" id="strokeWidth" value="6" min="1" max="10" step="1">
        </div>

        <div class="input-group">
            <label for="noiseDensity">Noise Density (0-8):</label>
            <input type="number" id="noiseDensity" value="5" min="0" max="8" step="1">
        </div>

        <div class="input-group">
            <label for="wobbleIntensity">Wobble Intensity (1-5):</label>
            <input type="number" id="wobbleIntensity" value="3" min="1" max="5" step="1">
        </div>

        <div class="input-group">
            <label for="width">Canvas Width (200-800):</label>
            <input type="number" id="width" value="400" min="200" max="800" step="50">
        </div>

        <div class="input-group">
            <label for="height">Canvas Height (200-800):</label>
            <input type="number" id="height" value="400" min="200" max="800" step="50">
        </div>

        <div class="input-group">
            <label for="minValue">Min Rotation Value (0-180):</label>
            <input type="number" id="minValue" value="20" min="0" max="180" step="10">
        </div>

        <div class="input-group">
            <label for="maxValue">Max Rotation Value (0-360):</label>
            <input type="number" id="maxValue" value="90" min="0" max="360" step="10">
        </div>

        <div class="input-group">
            <label for="step">Rotation Step (1-30):</label>
            <input type="number" id="step" value="10" min="1" max="30" step="1">
        </div>

        <div class="input-group">
            <label for="noise">
                <input type="checkbox" id="noise" checked style="width: auto; display: inline-block; margin-right: 8px;">
                Enable Noise
            </label>
        </div>

        <div class="input-group">
            <label for="canvasBg">Canvas Background Color:</label>
            <input type="color" id="canvasBg" value="#ffffff" style="height: 40px;">
        </div>

        <div class="button-group">
            <button id="verifyBtn">Verify Answer</button>
            <button id="refreshBtn">🔄 New Captcha</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        let currentToken = null;

        async function loadCaptcha() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const captchaImage = document.getElementById('captchaImage');
            const message = document.getElementById('message');
            const answerInput = document.getElementById('answerInput');
            
            loadingIndicator.style.display = 'block';
            captchaImage.style.display = 'none';
            message.style.display = 'none';
            answerInput.value = '';

            try {
                const strokeWidth = parseInt(document.getElementById('strokeWidth').value);
                const noiseDensity = parseInt(document.getElementById('noiseDensity').value);
                const wobbleIntensity = parseInt(document.getElementById('wobbleIntensity').value);
                const width = parseInt(document.getElementById('width').value);
                const height = parseInt(document.getElementById('height').value);
                const minValue = parseInt(document.getElementById('minValue').value);
                const maxValue = parseInt(document.getElementById('maxValue').value);
                const step = parseInt(document.getElementById('step').value);
                const noise = document.getElementById('noise').checked;
                const canvasBg = document.getElementById('canvasBg').value;

                const params = new URLSearchParams({
                    strokeWidth: strokeWidth,
                    noiseDensity: noiseDensity,
                    wobbleIntensity: wobbleIntensity,
                    width: width,
                    height: height,
                    minValue: minValue,
                    maxValue: maxValue,
                    step: step,
                    noise: noise,
                    canvasBg: canvasBg
                });

                const response = await fetch(`/api/create?${params}`);
                const data = await response.json();
                
                currentToken = data.token;
                captchaImage.src = data.image;
                captchaImage.style.display = 'block';
                loadingIndicator.style.display = 'none';
            } catch (error) {
                loadingIndicator.innerHTML = '<p>Error loading captcha. Please refresh.</p>';
                console.error('Error:', error);
            }
        }

        async function verifyCaptcha() {
            const answerInput = document.getElementById('answerInput');
            const message = document.getElementById('message');
            const verifyBtn = document.getElementById('verifyBtn');
            
            const answer = answerInput.value;
            
            if (!answer) {
                showMessage('Please enter an answer', 'error');
                return;
            }

            if (!currentToken) {
                showMessage('Please load a captcha first', 'error');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: currentToken,
                        answer: answer
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage('✓ Correct! Well done!', 'success');
                    setTimeout(() => {
                        loadCaptcha();
                    }, 2000);
                } else {
                    showMessage('✗ Incorrect. Try again or get a new captcha.', 'error');
                }
            } catch (error) {
                showMessage('Error verifying answer', 'error');
                console.error('Error:', error);
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify Answer';
            }
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        // Event listeners
        document.getElementById('verifyBtn').addEventListener('click', verifyCaptcha);
        document.getElementById('refreshBtn').addEventListener('click', loadCaptcha);
        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyCaptcha();
            }
        });

        // Load captcha on page load
        loadCaptcha();
    </script>
</body>
</html>
